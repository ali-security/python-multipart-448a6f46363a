name: Python package

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest -k expression to run a subset of tests"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2023-02-27T16:40:14Z@time-machines-pypi.sealsecurity.io/

jobs:
  build:

    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Test with pytest
        run: |
          # This should be inv test but invoke does not have python3.11 support yet.
          # See https://github.com/pyinvoke/invoke/issues/891 for details
          if [ -n "${{ inputs.test-filter }}" ]; then
            pytest -v -k "${{ inputs.test-filter }}"
          else
            pytest -v
          fi
